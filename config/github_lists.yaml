# Community-maintained job aggregators.
#
# This copy uses a new-grad feed instead of the inherited internship defaults.

enabled: true

# Link shorteners some lists use instead of the employer URL. Each run swaps
# them for the URL they redirect to (one HEAD request each; see
# src/sources/short_links.py), so dedup and auto-apply see the real posting.
short_link_hosts:
  - go.vansh.nyc

# JSON lists (SimplifyJobs-style listings.json schema).
lists:
  - name: vanshb03-new-grad-2027
    url: https://raw.githubusercontent.com/vanshb03/New-Grad-2027/dev/.github/scripts/listings.json
  - name: simplifyjobs-new-grad-positions
    url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json

# README markdown-table lists (Company | Role | Location | Posted | Visa | Apply).
readme_tables: []
